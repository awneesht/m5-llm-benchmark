[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macsmart"
version = "0.1.0"
description = "Memory-intelligent local LLM orchestration for 16GB Apple Silicon Macs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MacSmart Contributors"},
]

dependencies = [
    "mlx>=0.16.0",
    "mlx-lm>=0.18.0",
    "psutil>=5.9.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "PyYAML>=6.0",
    "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
macsmart = "macsmart.cli:cli"

[tool.setuptools.packages.find]
include = ["macsmart*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
