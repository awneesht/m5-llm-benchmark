[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macsmart"
version = "0.2.0"
description = "Memory-intelligent local LLM orchestration for 16GB Apple Silicon Macs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Awneesh Tiwari", email = "awneesht@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mlx>=0.16.0",
    "mlx-lm>=0.18.0",
    "psutil>=5.9.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "PyYAML>=6.0",
    "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/awneesht/m5-llm-benchmark"
Repository = "https://github.com/awneesht/m5-llm-benchmark"
"Bug Tracker" = "https://github.com/awneesht/m5-llm-benchmark/issues"

[project.scripts]
macsmart = "macsmart.cli:cli"

[tool.setuptools.packages.find]
include = ["macsmart*"]

[tool.setuptools.package-data]
"macsmart.data" = ["*.yaml"]
"macsmart.dashboard" = ["static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
